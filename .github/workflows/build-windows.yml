name: Windows EXE olustur

# Ne zaman calisir:
#  - main'e her push'ta
#  - "Actions" sekmesinden elle (workflow_dispatch)
#  - v* etiketi (tag) push'ta -> ayrica Release'e .exe eklenir
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur (klasik mod, torch yok)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: EXE olustur (PyInstaller)
        run: pyinstaller --noconfirm packaging/VeriMark.spec

      - name: EXE'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: VeriMark-windows
          path: dist/VeriMark.exe
          if-no-files-found: error

      - name: Etiketliyse Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VeriMark.exe
